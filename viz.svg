<text x="56.0" y="307.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Answer: "ninja". Ties break lexicographically smaller — determinism again. DFS over</text>
